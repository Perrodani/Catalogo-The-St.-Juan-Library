<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The St. Juan Library</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    header {
      max-width: 1400px;
      margin: 0 auto 20px auto;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      color: #ef4444;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    #stats {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 25px;
    }
    input[type="text"], select, button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"] { width: 320px; max-width: 100%; }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    button { cursor: pointer; font-weight: 600; }
    button:hover { background: #334155; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .cover-wrapper {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #0f172a;
    }
    .cover-wrapper img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
    }
    .placeholder-cover {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.85rem;
    }
    .placeholder-cover span { font-size: 2.5rem; margin-bottom: 6px; }
    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .title {
      font-weight: 700;
      font-size: 0.95rem;
      line-height: 1.3;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .author {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .series {
      font-size: 0.8rem;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .badge-duracion {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      align-self: flex-start;
      margin-top: auto;
      padding: 2px 8px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal {
      background: #1e293b;
      border-radius: 14px;
      max-width: 650px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      border: 1px solid var(--border);
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .modal h2 { margin-bottom: 8px; font-size: 1.4rem; padding-right: 30px; }
    .modal-sub { color: var(--accent); margin-bottom: 16px; font-size: 0.95rem; }
    .modal-summary { font-size: 0.95rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 16px; }
    .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .modal-tag {
      background: #334155;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <header>
    <h1>The St. Juan Library</h1>
    <div id="stats">Cargando colección...</div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Buscar por título, autor, saga o sinopsis...">
      <select id="authorSelect"><option value="">Todos los autores</option></select>
      <select id="sagaSel"><option value="">Todas las sagas</option></select>
      <select id="genreSelect"><option value="">Todos los géneros</option></select>
      <select id="sortSelect">
        <option value="title">Ordenar: Título (A-Z)</option>
        <option value="author">Ordenar: Autor (A-Z)</option>
        <option value="duration_desc">Duración: Mayor a Menor</option>
        <option value="duration_asc">Duración: Menor a Mayor</option>
        <option value="award">Obras premiadas primero</option>
      </select>
      <button id="filterAwardBtn" type="button">🏆 Premiados</button>
    </div>
  </header>

  <div class="grid" id="audiobookGrid"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 id="modalTitle"></h2>
      <div class="modal-sub" id="modalSub"></div>
      <div id="modalAward" style="display:none; color: #f59e0b; font-weight: bold; margin-bottom: 12px;"></div>
      <div class="modal-summary" id="modalSummary"></div>
      <div class="modal-tags" id="modalTags"></div>
    </div>
  </div>

  <script src="catalogo_datos.js"></script>
  <script>
    var soloPremiados = false;
    function normalizar(t){ return (t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
    function fmtDur(s){ var n=parseFloat(s); if(!n||isNaN(n)||n<=0)return ''; var h=Math.floor(n/3600), m=Math.floor((n%3600)/60); return h>0 ? h+' h '+(m>0?m+' min':'') : m+' min'; }
    function fmtTotal(s){ var n=parseFloat(s); if(!n||isNaN(n)||n<=0)return ''; var d=Math.floor(n/86400), h=Math.floor((n%86400)/3600); return d>0 ? d+' días y '+h+' horas' : h+' horas'; }

    function poblar(){
      if(typeof DATOS_AUDIOLIBROS==='undefined' || !DATOS_AUDIOLIBROS.length) return;
      
      var selA = document.getElementById('authorSelect');
      var auts = new Set();
      for(var i=0; i<DATOS_AUDIOLIBROS.length; i++){
        var a = (DATOS_AUDIOLIBROS[i].author||'').trim();
        if(a && a.toLowerCase()!=='desconocido') auts.add(a);
      }
      Array.from(auts).sort(function(x,y){return x.localeCompare(y);}).forEach(function(x){
        var o = document.createElement('option'); o.value = x; o.textContent = x; selA.appendChild(o);
      });

      var selS = document.getElementById('sagaSel');
      var sags = new Set();
      for(var j=0; j<DATOS_AUDIOLIBROS.length; j++){
        var s = (DATOS_AUDIOLIBROS[j].series||'').trim();
        if(s && s.toLowerCase()!=='independiente') sags.add(s);
      }
      Array.from(sags).sort(function(x,y){return x.localeCompare(y);}).forEach(function(x){
        var o = document.createElement('option'); o.value = x; o.textContent = x; selS.appendChild(o);
      });

      var selG = document.getElementById('genreSelect');
      var gens = new Set();
      for(var k=0; k<DATOS_AUDIOLIBROS.length; k++){
        var gl = DATOS_AUDIOLIBROS[k].genres||[]; if(typeof gl==='string') gl=[gl];
        for(var gi=0; gi<gl.length; gi++){ var g=(gl[gi]||'').trim(); if(g) gens.add(g); }
      }
      Array.from(gens).sort(function(x,y){return x.localeCompare(y);}).forEach(function(x){
        var o = document.createElement('option'); o.value = x; o.textContent = x; selG.appendChild(o);
      });
    }

    function render(){
      var grid = document.getElementById('audiobookGrid');
      var stats = document.getElementById('stats');
      if(typeof DATOS_AUDIOLIBROS==='undefined' || !DATOS_AUDIOLIBROS.length){
        stats.textContent = 'No se encontraron datos en catalogo_datos.js';
        return;
      }

      var q = normalizar(document.getElementById('searchInput').value);
      var fa = document.getElementById('authorSelect').value;
      var fs = document.getElementById('sagaSel').value;
      var fg = document.getElementById('genreSelect').value;
      var ord = document.getElementById('sortSelect').value;

      var res = [], totSec = 0;
      for(var i=0; i<DATOS_AUDIOLIBROS.length; i++){
        var b = DATOS_AUDIOLIBROS[i];
        var pr = (b.award||b.awards||'').trim();
        if(soloPremiados && !pr) continue;
        if(fa && (b.author||'').trim() !== fa) continue;
        if(fs && (b.series||'').trim() !== fs) continue;
        if(fg){
          var gl = b.genres||[]; if(typeof gl==='string') gl=[gl];
          var tieneG = false;
          for(var gi=0; gi<gl.length; gi++){ if((gl[gi]||'').trim()===fg){ tieneG=true; break; } }
          if(!tieneG) continue;
        }
        if(q){
          var full = normalizar(b.title)+' '+normalizar(b.author)+' '+normalizar(b.series)+' '+normalizar(b.summary||b.description||'');
          if(full.indexOf(q)===-1) continue;
        }
        totSec += (parseFloat(b.duration)||0);
        res.push({ libro: b, idx: i });
      }

      res.sort(function(a, b){
        var la = a.libro, lb = b.libro;
        if(ord==='author') return (la.author||'').localeCompare(lb.author||'');
        if(ord==='duration_desc') return (parseFloat(lb.duration)||0) - (parseFloat(la.duration)||0);
        if(ord==='duration_asc') return (parseFloat(la.duration)||0) - (parseFloat(lb.duration)||0);
        if(ord==='award'){
          var pa = (la.award||la.awards||'').trim()?1:0, pb = (lb.award||lb.awards||'').trim()?1:0;
          if(pa!==pb) return pb-pa;
        }
        return (la.title||'').localeCompare(lb.title||'');
      });

      var txtT = fmtTotal(totSec);
      stats.innerHTML = '<strong>' + res.length + '</strong> de ' + DATOS_AUDIOLIBROS.length + ' audiolibros' + 
        (txtT ? ' <span style="margin: 0 6px; opacity: 0.4;">•</span> <span style="color: #38bdf8; font-weight: 600;">⏱ ' + txtT + '</span>' : '') +
        (soloPremiados ? ' <span style="color: #f59e0b; font-weight: 600;">(Solo Premiados)</span>' : '');

      var out = '';
      for(var k=0; k<res.length; k++){
        var item = res[k], l = item.libro, orig = item.idx;
        var cov = l.cover || 'covers/default.jpg';
        var d = fmtDur(l.duration);
        var s = (l.series||'').trim();
        var prBadge = (l.award||l.awards||'').trim();

        out += '<div class="card" onclick="abrir('+orig+')">';
        out += '  <div class="cover-wrapper">';
        if(prBadge){
          out += '<div style="position: absolute; top: 8px; right: 8px; background: rgba(245, 158, 11, 0.95); color: #000; font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 4px; z-index: 2;">'+(prBadge.indexOf('🏆')!==-1?prBadge:'🏆 '+prBadge)+'</div>';
        }
        out += '    <img src="'+cov+'" alt="'+(l.title||'')+'" onerror="this.parentElement.innerHTML=\'<div class=\\\'placeholder-cover\\\'><span>🎧</span><div>Sin portada</div></div>\'" loading="lazy">';
        out += '  </div>';
        out += '  <div class="card-body">';
        out += '    <div class="title" title="'+(l.title||'')+'">'+(l.title||'Sin título')+'</div>';
        out += '    <div class="author">'+(l.author||'Autor desconocido')+'</div>';
        if(!s || s.toLowerCase()==='independiente'){
          out += '    <div class="series" style="opacity: 0.7; font-style: italic;">Novela autoconclusiva</div>';
        } else {
          out += '    <div class="series">'+s+'</div>';
        }
        if(d){
          out += '    <div class="badge-duracion">⏱ '+d+'</div>';
        }
        out += '  </div></div>';
      }
      if(!res.length){
        out = '<div style="grid-column: 1/-1; padding: 50px; text-align: center; color: var(--text-muted);">No se encontraron audiolibros con los filtros seleccionados.</div>';
      }
      grid.innerHTML = out;
    }

    function abrir(idx){
      var l = DATOS_AUDIOLIBROS[idx];
      if(!l) return;
      document.getElementById('modalTitle').textContent = l.title || 'Sin título';
      var d = l.duration ? ' · ⏱ ' + fmtDur(l.duration) : '';
      var s = (!l.series || l.series.trim().toLowerCase()==='independiente') ? 'Novela autoconclusiva' : 'Saga: ' + l.series;
      document.getElementById('modalSub').textContent = (l.author||'Autor desconocido') + ' | ' + s + d;
      
      var maw = document.getElementById('modalAward');
      var pr = (l.award||l.awards||'').trim();
      if(pr){
        maw.textContent = pr.indexOf('🏆')!==-1 ? pr : '🏆 ' + pr;
        maw.style.display = 'block';
      } else {
        maw.style.display = 'none';
      }

      document.getElementById('modalSummary').textContent = l.summary || l.description || 'Sin descripción disponible.';
      var mtags = document.getElementById('modalTags');
      mtags.innerHTML = '';
      var gl = l.genres||[]; if(typeof gl==='string') gl=[gl];
      for(var g=0; g<gl.length; g++){
        var sp = document.createElement('span'); sp.className = 'modal-tag'; sp.textContent = gl[g]; mtags.appendChild(sp);
      }
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function cerrar(){ document.getElementById('modalOverlay').style.display = 'none'; }

    document.addEventListener('DOMContentLoaded', function(){
      poblar();
      render();
      document.getElementById('searchInput').oninput = render;
      document.getElementById('authorSelect').onchange = render;
      document.getElementById('sagaSel').onchange = render;
      document.getElementById('genreSelect').onchange = render;
      document.getElementById('sortSelect').onchange = render;
      document.getElementById('modalClose').onclick = cerrar;
      document.getElementById('modalOverlay').onclick = function(e){ if(e.target === this) cerrar(); };
      document.getElementById('filterAwardBtn').onclick = function(){
        soloPremiados = !soloPremiados;
        this.style.background = soloPremiados ? 'rgba(245, 158, 11, 0.25)' : '';
        this.style.borderColor = soloPremiados ? '#f59e0b' : '';
        this.style.color = soloPremiados ? '#f59e0b' : '';
        render();
      };
    });
  </script>
</body>
</html>
